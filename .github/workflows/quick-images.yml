name: Quick images

on:
  workflow_dispatch:
  push:
    paths:
      - "jobs/quick_images.json"

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install modal
      - name: Generate on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run modal_app/quick_images.py
      - name: Commit images
        run: |
          git config user.name "paper-tomorrows-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs
          git commit -m "Add quick images [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
