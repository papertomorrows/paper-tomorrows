name: Produce short

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec file, e.g. specs/001_mile_high.json"
        required: true
  push:
    paths:
      - "specs/**.json"
      - "modal_app/pipeline.py"
      - ".github/workflows/produce-short.yml"

permissions:
  contents: write

concurrency:
  group: produce-short
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal client
        run: pip install modal
      - name: Decide which specs to produce
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.spec }}" ]; then
            CANDIDATES="${{ github.event.inputs.spec }}"
          else
            CANDIDATES=$(git diff --name-only HEAD~1 HEAD -- 'specs/*.json' | tr '\n' ' ')
          fi
          SPECS=""
          for F in $CANDIDATES; do
            [ -f "$F" ] || continue
            if python3 -c "import json,sys; sys.exit(0 if str(json.load(open('$F')).get('status','')).startswith('ready') else 1)"; then
              SPECS="$SPECS $F"
            fi
          done
          echo "specs=$SPECS" >> "$GITHUB_OUTPUT"
          echo "Producing: $SPECS"
      - name: Stop if nothing is marked ready
        if: steps.pick.outputs.specs == ''
        run: echo "No spec marked ready - nothing to produce."
      - name: Sync API keys into Modal's secret store
        if: steps.pick.outputs.specs != ''
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          XI_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVENLABS }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          modal secret create paper-tomorrows-keys \
            FAL_KEY="$FAL_KEY" XI_KEY="$XI_KEY" PIXABAY_API_KEY="$PIXABAY_API_KEY" --force > /dev/null
          echo "keys synced"
      - name: Produce on Modal
        if: steps.pick.outputs.specs != ''
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          : > run_output.txt
          FAILS=0
          PIDS=()
          for SPEC in ${{ steps.pick.outputs.specs }}; do
            NAME=$(basename "$SPEC" .json)
            (
              for TRY in 1 2 3; do
                APP=modal_app/pipeline.py
                case "$NAME" in pyog_ep*|lf_*) APP=modal_app/pyog.py;; esac
                T=2700; [ "$APP" = modal_app/pyog.py ] && T=6200; timeout $T modal run "$APP" --spec "$SPEC" > "log_$NAME.txt" 2>&1 && exit 0
                grep -qi "rate limit" "log_$NAME.txt" || exit 1
                echo "rate limited, retrying $NAME (try $TRY)"; sleep $((30 * TRY))
              done
              exit 1
            ) &
            PIDS+=($!)
            sleep 20
          done
          for PID in "${PIDS[@]}"; do wait "$PID" || FAILS=$((FAILS+1)); done
          cat log_*.txt >> run_output.txt
          for L in log_*.txt; do
            R=$(grep -E "SHORT OK" "$L" | cut -c1-300 || true)
            if [ -n "$R" ]; then echo "::notice title=Result::${R}"; else
              E=$( (grep -E "Error|FAILED|failed|STEP" "$L"; tail -3 "$L") | tail -6 | tr '\n' ' ' | cut -c1-600)
              echo "::error title=Failure::${L}: ${E}"; fi
          done
          [ "$FAILS" -eq 0 ]
      - name: Show run logs
        if: always()
        run: |
          for f in log_*.txt; do [ -f "$f" ] || continue; echo "== $f"; grep -aE "STEP|FAILED|OK|Error|PICK" "$f" | tail -200; tail -15 "$f"; done
      - name: Report error
        if: failure()
        run: |
          echo "see per-short errors above"
      - name: Deliver long-form videos (kept per episode on the 'deliveries' branch)
        if: always()
        run: |
          [ -d outputs/longform ] || exit 0
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 -b deliveries "$URL" /tmp/deliv 2>/dev/null || (mkdir -p /tmp/deliv && git -C /tmp/deliv init -q)
          for d in outputs/longform/*/; do
            id=$(basename "$d"); rm -rf "/tmp/deliv/$id"; cp -r "$d" "/tmp/deliv/$id"
            for f in /tmp/deliv/$id/*.mp4; do split -b 90m -d "$f" "$f.part"; rm "$f"; done
          done
          cd /tmp/deliv
          git checkout -q --orphan fresh && git add -A
          git -c user.name=paper-tomorrows-bot -c user.email=actions@users.noreply.github.com commit -qm "long-form deliveries"
          git push -qf "$URL" HEAD:deliveries
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "paper-tomorrows-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/shorts
          git commit -m "Add produced shorts [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
