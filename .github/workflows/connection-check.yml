name: Connection check (GitHub -> Modal)

on:
  workflow_dispatch:
  push:
    paths:
      - "modal_app/connection_check.py"
      - ".github/workflows/connection-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal client
        run: pip install modal
      - name: Run check on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          modal run modal_app/connection_check.py | tee run_output.txt
          RESULT=$(grep "CONNECTION CHECK OK" run_output.txt || echo "no result line")
          echo "::notice title=Result::${RESULT}"
